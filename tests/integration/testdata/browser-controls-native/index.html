<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>C02 native control facts</title>
  </head>
  <body>
    <main id="controls-native">
      <form id="n-form">
        <input id="n-text" type="text" value="start" aria-label="text field" />
        <input id="n-check" type="checkbox" aria-label="check field" />
      </form>
      <select id="n-multi" multiple aria-label="multi field">
        <option value="a">A</option>
        <option value="b">B</option>
        <option value="c">C</option>
      </select>
      <select id="n-single" aria-label="single field">
        <option value="x">X</option>
        <option value="y">Y</option>
        <option value="z">Z</option>
      </select>
      <input id="n-files" type="file" multiple aria-label="file field" />
      <div id="n-panel">panel</div>
    </main>
  </body>
</html>
